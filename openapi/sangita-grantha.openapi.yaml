components:

  parameters:
    CatalogueQuery:
      name: query
      in: query
      schema: { type: string, maxLength: 200 }
    CataloguePage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    CataloguePageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    RasikaSessionHeader:
      name: X-Rasika-Session-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: In-memory anonymous session UUID. Ignored if malformed.
    RasikaInteractionHeader:
      name: X-Rasika-Interaction-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Logical interaction UUID spanning retries of one user action.

  responses:
    CatalogueValidationError:
      description: Invalid query, paging, or UUID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CatalogueError"
    CatalogueNotFound:
      description: Missing, unpublished, or wrong-owner public resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CatalogueError"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by POST /v1/auth/token. The token carries a `roles` claim populated from the
        user's stored role assignments — roles cannot be requested by the caller. Admin endpoints
        additionally require the `grp_sangita_admin` role: a missing or invalid token yields 401,
        a valid token without the role yields 403.

  schemas:

    LanguageCode:
      type: string
      enum: [sa, te, ta, kn, ml, hi, en]

    MusicalForm:
      type: string
      enum: [KRITHI, VARNAM, SWARAJATHI, UNESTABLISHED]
      description: Explicit musical form classification or UNESTABLISHED

    KrithiStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, PUBLISHED, ARCHIVED]

    KrithiSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        composerName: { type: string }
        primaryLanguage: { $ref: "#/components/schemas/LanguageCode" }
        musicalForm: { $ref: "#/components/schemas/MusicalForm" }
        ragas:
          type: array
          items: { $ref: "#/components/schemas/RagaRef" }

    KrithiSearchResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KrithiSummary" }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, minimum: 1 }

    KrithiDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        composer: { $ref: "#/components/schemas/Composer" }
        primaryLanguage: { $ref: "#/components/schemas/LanguageCode" }
        musicalForm: { $ref: "#/components/schemas/MusicalForm" }
        tala: { $ref: "#/components/schemas/Tala" }
        ragas:
          type: array
          items: { $ref: "#/components/schemas/RagaRef" }
        deity: { $ref: "#/components/schemas/Deity" }
        temple: { $ref: "#/components/schemas/Temple" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/KrithiSection" }
        lyricVariants:
          type: array
          items: { $ref: "#/components/schemas/KrithiLyricVariant" }
        notationVariants:
          type: array
          items: { $ref: "#/components/schemas/KrithiNotationVariant" }
          description: Only present for VARNAM/SWARAJATHI compositions
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        status: { $ref: "#/components/schemas/KrithiStatus" }

    KrithiCreateRequest:
      type: object
      required: [name, composerId, talaId, primaryLanguage, musicalForm]
      properties:
        name: { type: string }
        composerId: { type: string, format: uuid }
        talaId: { type: string, format: uuid }
        primaryLanguage: { $ref: "#/components/schemas/LanguageCode" }
        musicalForm: { $ref: "#/components/schemas/MusicalForm" }
        ragaIds:
          type: array
          items: { type: string, format: uuid }

    KrithiUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/KrithiCreateRequest"
        - type: object
          properties:
            status: { $ref: "#/components/schemas/KrithiStatus" }

    KrithiSection:
      type: object
      properties:
        id: { type: string, format: uuid }
        sectionType:
          type: string
          enum: [PALLAVI, ANUPALLAVI, CHARANAM, CHITTASWARAM, OTHER]
        orderIndex: { type: integer }

    KrithiLyricVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/LanguageCode" }
        script: { type: string }
        sampradaya: { $ref: "#/components/schemas/Sampradaya" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/KrithiLyricSection" }

    KrithiLyricSection:
      type: object
      properties:
        sectionId: { type: string, format: uuid }
        text: { type: string }

    Composer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    RagaRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        orderIndex: { type: integer }

    Raga:
      $ref: "#/components/schemas/RagaRef"

    Tala:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Deity:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Temple:
      type: object
      properties:
        id: { type: string, format: uuid }
        canonicalName: { type: string }
        names:
          type: array
          items: { $ref: "#/components/schemas/TempleName" }

    TempleName:
      type: object
      properties:
        language: { $ref: "#/components/schemas/LanguageCode" }
        script: { type: string }
        name: { type: string }
        isPrimary: { type: boolean }

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        displayName: { type: string }

    Sampradaya:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }

    ImportedKrithi:
      type: object
      properties:
        source: { type: string }
        rawPayload: { type: object }

    KrithiNotationVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        krithiId: { type: string, format: uuid }
        notationType:
          type: string
          enum: [SWARA, JATHI]
        talaId: { type: string, format: uuid }
        kalai: { type: integer, default: 1 }
        eduppuOffsetBeats: { type: integer }
        variantLabel: { type: string }
        sourceReference: { type: string }
        isPrimary: { type: boolean }
        notationRows:
          type: array
          items: { $ref: "#/components/schemas/KrithiNotationRow" }

    KrithiNotationRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        notationVariantId: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        orderIndex: { type: integer }
        swaraText: { type: string }
        sahityaText: { type: string }
        talaMarkers: { type: string }

    NotationVariantCreateRequest:
      type: object
      required: [notationType, notationRows]
      properties:
        notationType:
          type: string
          enum: [SWARA, JATHI]
        talaId: { type: string, format: uuid }
        kalai: { type: integer, default: 1 }
        eduppuOffsetBeats: { type: integer }
        variantLabel: { type: string }
        sourceReference: { type: string }
        isPrimary: { type: boolean, default: false }
        notationRows:
          type: array
          items: { $ref: "#/components/schemas/NotationRowCreateRequest" }

    NotationRowCreateRequest:
      type: object
      required: [sectionId, orderIndex, swaraText]
      properties:
        sectionId: { type: string, format: uuid }
        orderIndex: { type: integer }
        swaraText: { type: string }
        sahityaText: { type: string }
        talaMarkers: { type: string }

    NotationVariantUpdateRequest:
      type: object
      properties:
        talaId: { type: string, format: uuid }
        kalai: { type: integer }
        eduppuOffsetBeats: { type: integer }
        variantLabel: { type: string }
        sourceReference: { type: string }
        isPrimary: { type: boolean }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }

    CatalogueLanguageCode:
      type: string
      enum: [SA, TA, TE, KN, ML, HI, EN]
      description: kotlinx.serialization enum names (TRACK-138 catalogue)

    CatalogueScriptCode:
      type: string
      enum: [DEVANAGARI, TAMIL, TELUGU, KANNADA, MALAYALAM, LATIN]

    CatalogueError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, UNAVAILABLE]
        message: { type: string }

    CatalogueComposerRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    CatalogueTalaRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    CatalogueRagaRef:
      type: object
      required: [id, name, orderIndex]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        orderIndex: { type: integer }
        section:
          type: string
          nullable: true

    CatalogueKrithiSummary:
      type: object
      required: [id, title, composer, ragas, musicalForm, isRagamalika]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        incipit: { type: string, nullable: true }
        composer: { $ref: "#/components/schemas/CatalogueComposerRef" }
        ragas:
          type: array
          items: { $ref: "#/components/schemas/CatalogueRagaRef" }
        tala:
          allOf:
            - $ref: "#/components/schemas/CatalogueTalaRef"
          nullable: true
        musicalForm: { $ref: "#/components/schemas/CatalogueV1MusicalForm" }
        isRagamalika: { type: boolean }

    CatalogueKrithiPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogueKrithiSummary" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    CatalogueVariantRef:
      type: object
      required: [id, language, script, isPrimary]
      properties:
        id: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/CatalogueLanguageCode" }
        script: { $ref: "#/components/schemas/CatalogueScriptCode" }
        transliterationScheme: { type: string, nullable: true }
        isPrimary: { type: boolean }
        label: { type: string, nullable: true }
        sourceReference: { type: string, nullable: true }

    CatalogueKrithiReader:
      type: object
      required: [id, title, composer, ragas, musicalForm, originalLanguage, isRagamalika, variants, completeness]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        incipit: { type: string, nullable: true }
        composer: { $ref: "#/components/schemas/CatalogueComposerRef" }
        ragas:
          type: array
          items: { $ref: "#/components/schemas/CatalogueRagaRef" }
        tala:
          allOf:
            - $ref: "#/components/schemas/CatalogueTalaRef"
          nullable: true
        musicalForm: { $ref: "#/components/schemas/CatalogueV1MusicalForm" }
        originalLanguage: { $ref: "#/components/schemas/CatalogueLanguageCode" }
        isRagamalika: { type: boolean }
        defaultVariantId: { type: string, format: uuid, nullable: true }
        variants:
          type: array
          items: { $ref: "#/components/schemas/CatalogueVariantRef" }
        completeness:
          type: string
          enum: [UNKNOWN, PARTIAL, COMPLETE]

    CatalogueLyricSection:
      type: object
      required: [sectionId, sectionType, orderIndex, text]
      properties:
        sectionId: { type: string, format: uuid }
        sectionType: { type: string }
        label: { type: string, nullable: true }
        orderIndex: { type: integer }
        text: { type: string }

    CatalogueLyrics:
      type: object
      required: [variantId, krithiId, language, script, isPrimary, sections]
      properties:
        variantId: { type: string, format: uuid }
        krithiId: { type: string, format: uuid }
        language: { $ref: "#/components/schemas/CatalogueLanguageCode" }
        script: { $ref: "#/components/schemas/CatalogueScriptCode" }
        transliterationScheme: { type: string, nullable: true }
        isPrimary: { type: boolean }
        label: { type: string, nullable: true }
        sourceReference: { type: string, nullable: true }
        unsegmentedText: { type: string, nullable: true }
        sections:
          type: array
          items: { $ref: "#/components/schemas/CatalogueLyricSection" }

    CatalogueRagaSummary:
      type: object
      required: [id, name, matchingAliases, publishedCompositionCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        matchingAliases:
          type: array
          items: { type: string }
        publishedCompositionCount: { type: integer, format: int64 }
        melakartaNumber: { type: integer, nullable: true }
        parentRagaName: { type: string, nullable: true }
        parentMelakartaNumber: { type: integer, nullable: true }

    CatalogueRagaPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogueRagaSummary" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    CatalogueNomenclatureLink:
      type: object
      required: [relatedRagaId, relatedRagaName, relationLabel]
      properties:
        relatedRagaId: { type: string, format: uuid }
        relatedRagaName: { type: string }
        relationLabel: { type: string }

    CatalogueRagaDetail:
      type: object
      required: [id, name, aliases, publishedCompositionCount, nomenclatureLinks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        publishedCompositionCount: { type: integer, format: int64 }
        melakartaNumber: { type: integer, nullable: true }
        parentRagaId: { type: string, format: uuid, nullable: true }
        parentRagaName: { type: string, nullable: true }
        arohanam: { type: string, nullable: true }
        avarohanam: { type: string, nullable: true }
        nomenclatureLinks:
          type: array
          items: { $ref: "#/components/schemas/CatalogueNomenclatureLink" }

    CatalogueComposerSummary:
      type: object
      required: [id, name, matchingAliases, publishedCompositionCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        matchingAliases:
          type: array
          items: { type: string }
        publishedCompositionCount: { type: integer, format: int64 }

    CatalogueComposerPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogueComposerSummary" }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }

    CatalogueComposerDetail:
      type: object
      required: [id, name, aliases, publishedCompositionCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        publishedCompositionCount: { type: integer, format: int64 }
        birthYear: { type: integer, nullable: true }
        deathYear: { type: integer, nullable: true }
        place: { type: string, nullable: true }

    "CatalogueRagaRefV2":
      "type": "object"
      "required":
        - "id"
        - "name"
        - "orderIndex"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "orderIndex":
          "type": "integer"
        "section":
          "type": "string"
          "nullable": true
        "sectionId":
          "type": "string"
          "format": "uuid"
          "nullable": true
          "description": "Explicit lyric-section relationship only; never inferred from order or section type."
    "CatalogueKrithiSummaryV2":
      "type": "object"
      "required":
        - "id"
        - "title"
        - "composer"
        - "ragas"
        - "musicalForm"
        - "isRagamalika"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "title":
          "type": "string"
        "incipit":
          "type": "string"
          "nullable": true
        "composer":
          "$ref": "#/components/schemas/CatalogueComposerRef"
        "ragas":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CatalogueRagaRefV2"
        "tala":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueTalaRef"
          "nullable": true
        "musicalForm":
          "$ref": "#/components/schemas/CatalogueMusicalFormV2"
        "isRagamalika":
          "type": "boolean"
    "CatalogueKrithiReaderV2":
      "type": "object"
      "required":
        - "id"
        - "title"
        - "composer"
        - "ragas"
        - "musicalForm"
        - "originalLanguage"
        - "isRagamalika"
        - "variants"
        - "completeness"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "title":
          "type": "string"
        "incipit":
          "type": "string"
          "nullable": true
        "composer":
          "$ref": "#/components/schemas/CatalogueComposerRef"
        "ragas":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CatalogueRagaRefV2"
        "tala":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueTalaRef"
          "nullable": true
        "musicalForm":
          "$ref": "#/components/schemas/CatalogueMusicalFormV2"
        "originalLanguage":
          "$ref": "#/components/schemas/CatalogueLanguageCode"
        "isRagamalika":
          "type": "boolean"
        "defaultVariantId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "variants":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CatalogueVariantRef"
        "completeness":
          "type": "string"
          "enum":
            - "UNKNOWN"
            - "PARTIAL"
            - "COMPLETE"
        "deity":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueReference"
          "nullable": true
        "temple":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueReference"
          "nullable": true
        "cycleContext":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueCycleContext"
          "nullable": true
          "description": "V2 only. Omitted when the kriti has no reviewed cycle context."
    "CatalogueOrderBasis":
      "type": "string"
      "enum":
        - "SOURCE"
        - "PERFORMANCE_CONVENTION"
        - "UNSPECIFIED"
      "description": "SOURCE: position attested by the cycle structure. PERFORMANCE_CONVENTION: later concert order. UNSPECIFIED: clients must not show ordinals."
    "CatalogueCollectionRole":
      "type": "string"
      "enum":
        - "DHYANA"
        - "CORE"
        - "OPTIONAL"
        - "MANGALAM"
        - "DISPUTED_CONJECTURE"
    "CatalogueCollectionNeighbour":
      "type": "object"
      "required":
        - "krithiId"
        - "title"
      "properties":
        "krithiId":
          "type": "string"
          "format": "uuid"
        "title":
          "type": "string"
        "ragaName":
          "type": "string"
          "nullable": true
    "CatalogueCollectionRef":
      "type": "object"
      "required":
        - "collectionId"
        - "slug"
        - "name"
        - "role"
        - "sequenceOrder"
        - "coreCount"
      "properties":
        "collectionId":
          "type": "string"
          "format": "uuid"
        "slug":
          "type": "string"
        "name":
          "type": "string"
        "role":
          "$ref": "#/components/schemas/CatalogueCollectionRole"
        "sequenceOrder":
          "type": "integer"
        "position":
          "type": "integer"
          "nullable": true
          "description": "1-based rank among CORE members; null for other roles."
        "coreCount":
          "type": "integer"
        "axisValue":
          "type": "string"
          "nullable": true
        "orderBasis":
          "$ref": "#/components/schemas/CatalogueOrderBasis"
        "orderConvention":
          "type": "string"
          "nullable": true
        "attributes":
          "type": "object"
          "additionalProperties":
            "type": "string"
        "previous":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueCollectionNeighbour"
          "nullable": true
        "next":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueCollectionNeighbour"
          "nullable": true
    "CatalogueCycleContext":
      "type": "object"
      "properties":
        "collections":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CatalogueCollectionRef"
        "vibhaktiCase":
          "type": "string"
          "nullable": true
        "occasionNote":
          "type": "string"
          "nullable": true
    "CatalogueCollectionSummary":
      "type": "object"
      "required":
        - "id"
        - "slug"
        - "name"
        - "memberCount"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "slug":
          "type": "string"
        "name":
          "type": "string"
        "composer":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueComposerRef"
          "nullable": true
        "memberCount":
          "type": "integer"
        "orderBasis":
          "$ref": "#/components/schemas/CatalogueOrderBasis"
        "hasOverview":
          "type": "boolean"
    "CatalogueCollectionList":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/CatalogueCollectionSummary"
    "CatalogueMandalam":
      "type": "string"
      "enum": ["CHOLA", "PANDYA", "TONDAI", "NADU", "CHERA", "KONGU", "UTTARA"]
    "CataloguePlaceKind":
      "type": "string"
      "enum": ["LOCALITY", "COMPLEX", "SANNIDHI", "MANDAPAM"]
    "CatalogueTempleElement":
      "type": "string"
      "enum": ["AKASHA", "VAYU", "AGNI", "PRITHVI", "APPU"]
      "description": "The five bhutas. APPU is water."
    "CatalogueDeityPosture":
      "type": "string"
      "enum": ["SAYANA", "STHANAKA", "ASINA", "TANDAVA"]
    "CatalogueTemplePlace":
      "type": "object"
      "required":
        - "googlePlaceId"
        - "precision"
      "description": "Present only when the temple's place review state is CONFIRMED. The id is for building a Google Maps link client-side, with no API key. Nothing else from Google (coordinates, name, address) is stored or exposed. Always absent until TRACK-154 supplies confirmed place ids."
      "properties":
        "googlePlaceId":
          "type": "string"
        "precision":
          "type": "string"
          "enum": ["TEMPLE", "PARENT_COMPLEX"]
          "description": "TEMPLE is the temple's own place; PARENT_COMPLEX is a sannidhi or mandapam inheriting its parent complex's place."
    "CatalogueTempleSummary":
      "type": "object"
      "required":
        - "id"
        - "name"
        - "placeKind"
        - "publishedKrithiCount"
        - "childCount"
        - "recordedGap"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "city":
          "type": "string"
          "nullable": true
        "state":
          "type": "string"
          "nullable": true
        "placeKind":
          "$ref": "#/components/schemas/CataloguePlaceKind"
        "mandalam":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueMandalam"
          "nullable": true
        "element":
          "allOf":
            -
              "$ref": "#/components/schemas/CatalogueTempleElement"
          "nullable": true
        "publishedKrithiCount":
          "type": "integer"
          "format": "int64"
          "description": "Published kritis recorded directly at this temple; not rolled up over child shrines."
        "childCount":
          "type": "integer"
