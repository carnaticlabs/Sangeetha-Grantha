  /v2/catalogue/search/hybrid:
    post:
      tags: [Search]
      summary: Hybrid search with collection and kshetra cards (V2)
      description: >
        Anonymous and published-only. `items` are exactly the kriti hits `/v1/search/hybrid` returns
        for a non-admin caller, same fields and order. `macroHits` is a separate group of at most 3
        collection and kshetra cards, each backed by a published `CYCLE_OVERVIEW` or `KSHETRA_OVERVIEW`
        document, at most one per collection or temple, and only above a relevance floor, so it is
        often empty. Every `COLLECTION` hit resolves at `/v2/catalogue/collections/{slug}` and every
        `KSHETRA` hit at `/v2/catalogue/temples/{id}`. `exactTitleMatchId` is set when the query equals
        a published kriti's title or incipit: render that kriti first, then `macroHits`, then the
        remaining items. A `composerId` or `ragaId` filter empties `macroHits`. With no active
        embedding profile, retrieval is lexical for both groups. A blank query returns empty groups.
      security: []
      parameters:
        - $ref: "#/components/parameters/RasikaSessionHeader"
        - $ref: "#/components/parameters/RasikaInteractionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Kriti items plus the macro group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueSearchResponse"
        "503":
          description: Incompatible embedding profile or embedder failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v2/catalogue/search/semantic:
    post:
      tags: [Search]
      summary: Semantic search with collection and kshetra cards (V2)
      description: >
        Same contract as `/v2/catalogue/search/hybrid`, vector ranking only. With no active embedding
        profile both groups are empty.
      security: []
      parameters:
        - $ref: "#/components/parameters/RasikaSessionHeader"
        - $ref: "#/components/parameters/RasikaInteractionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Kriti items plus the macro group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueSearchResponse"
        "503":
          description: Incompatible embedding profile or embedder failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/search/hybrid:
    post:
      tags: [Search]
      summary: Hybrid composition search
      description: >
        Fuses lexical and vector ranks over indexed composition overviews and
        lyric passages. A missing or non-admin caller is published-only. An
        admin token can see editorial rows. Rasika does not send a token.
        `limit` defaults to 20 and the server clamps it to 1–100. `totalMatches`
        is the number of items returned, not a catalogue total. With no active
        embedding profile, retrieval is lexical over search documents. A blank
        query returns an empty list.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RasikaSessionHeader"
        - $ref: "#/components/parameters/RasikaInteractionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Ranked hybrid matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticSearchResponse"
        "503":
          description: Incompatible embedding profile or embedder failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/search/semantic:
    post:
      tags: [Search]
      summary: Semantic composition search
      description: >
        Dense similarity over the active embedding profile. A missing or
        non-admin caller is published-only. An admin token can see editorial
        rows. Rasika does not send a token. `limit` defaults to 20 and the
        server clamps it to 1–100. `totalMatches` is the number of items
        returned, not a catalogue total. With no active profile, or a blank
        query, the result list is empty. `lexicalScore` and `rrfScore` are null
        on this route.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RasikaSessionHeader"
        - $ref: "#/components/parameters/RasikaInteractionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Ranked semantic matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticSearchResponse"
        "503":
          description: Incompatible embedding profile or embedder failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

