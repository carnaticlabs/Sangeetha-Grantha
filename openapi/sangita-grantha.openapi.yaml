          "items":
            "type": "object"
            "required":
              - "id"
              - "expectedRevision"
            "properties":
              "id":
                "type": "string"
                "format": "uuid"
              "expectedRevision":
                "type": "integer"
                "format": "int64"
                "minimum": 1
    "CatalogueFeatureList":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "maxItems": 50
          "items":
            "$ref": "#/components/schemas/CatalogueFeature"

    CatalogueV1MusicalForm:
      type: string
      enum: [KRITHI, VARNAM, SWARAJATHI]

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
      description: StatusPages error body. Discovery 503 uses this shape, not CatalogueError.

    SemanticSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        composerId:
          type: string
          format: uuid
          nullable: true
        ragaId:
          type: string
          format: uuid
          nullable: true
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
          description: Server clamps to 1–100. Rasika sends 30.

    SemanticSearchResponse:
      type: object
      required: [query, totalMatches, items]
      properties:
        query: { type: string }
        totalMatches:
          type: integer
          description: Number of items returned, not a catalogue total.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SemanticSearchResultItem"

    CatalogueSearchResponse:
      type: object
      required: [query, totalMatches, macroHits, items]
      properties:
        query: { type: string }
        totalMatches:
          type: integer
          description: Kriti hits plus macro hits returned.
        macroHits:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CatalogueMacroHit"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SemanticSearchResultItem"
        exactTitleMatchId:
          type: string
          format: uuid
          description: Present when the query equals a published kriti's normalised title or incipit.

    CatalogueMacroHit:
      type: object
      required: [kind, title, snippet, similarityScore]
      description: Exactly one of collectionSlug (COLLECTION) or templeId (KSHETRA) is present.
      properties:
        kind:
          type: string
          enum: [COLLECTION, KSHETRA]
        title: { type: string }
        subtitle:
          type: string
          description: Composer name for a collection; place for a kshetra.
        snippet:
          type: string
          maxLength: 240
          description: Prefix of the stored overview, cut at a sentence or word boundary.
        collectionSlug: { type: string }
        templeId: { type: string, format: uuid }
        memberCount: { type: integer }
        publishedKrithiCount: { type: integer }
        recordedGap:
          type: boolean
          default: false
        similarityScore: { type: number, format: double }
        lexicalScore: { type: number, format: double }
        rrfScore: { type: number, format: double }

    SemanticSearchResultItem:
      type: object
      required: [krithiId, title, composerName, documentKind, matchedContent, similarityScore]
      properties:
        krithiId: { type: string, format: uuid }
        title: { type: string }
        composerName: { type: string }
        ragaName:
          type: string
          nullable: true
          description: Primary raga name from the search join, not the ordered raga sequence.
        talaName:
          type: string
          nullable: true
        documentKind: { type: string }
        matchedContent: { type: string }
        similarityScore: { type: number, format: double }
        lexicalScore:
          type: number
          format: double
          nullable: true
        rrfScore:
          type: number
          format: double
          nullable: true
