          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/RasikaSessionHeader"
        -
          "$ref": "#/components/parameters/RasikaInteractionHeader"
      "responses":
        "200":
          "description": "Stored composer profile"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CatalogueComposerDetail"
        "400":
          "$ref": "#/components/responses/CatalogueValidationError"
        "404":
          "$ref": "#/components/responses/CatalogueNotFound"
  "/v2/catalogue/discovery":
    "get":
      "tags":
        - "Catalogue"
      "security": []
      "description": "Published-only V2 contract. Unknown or repeated query parameters are rejected. No silent V1 fallback."
      "parameters": []
      "responses":
        "200":
          "description": "Allowlisted public response. Cache-Control: no-store."
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "enum":
                  - "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CatalogueDiscovery"
        "400":
          "$ref": "#/components/responses/CatalogueValidationError"
  "/v2/catalogue/collections":
    "get":
      "tags":
        - "Catalogue"
      "summary": "Reviewed cycle collections"
      "description": "Published-only V2. Lists collections whose memberships were written by a reviewed seed and whose kritis are published. Unknown query parameters are rejected."
      "security": []
      "parameters":
        -
          "$ref": "#/components/parameters/RasikaSessionHeader"
        -
          "$ref": "#/components/parameters/RasikaInteractionHeader"
      "responses":
        "200":
          "description": "Collections ordered by composer then name. Cache-Control: no-store."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CatalogueCollectionList"
        "400":
          "$ref": "#/components/responses/CatalogueValidationError"
  "/v2/catalogue/collections/{slug}":
    "get":
      "tags":
        - "Catalogue"
      "summary": "One reviewed cycle collection with ordered members"
      "description": "Members sort by role (dhyana, core, optional, mangalam, disputed), sequence, title. Disputed members carry the label `disputed`."
      "security": []
      "parameters":
        -
          "name": "slug"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
            "maxLength": 80
        -
          "$ref": "#/components/parameters/RasikaSessionHeader"
        -
          "$ref": "#/components/parameters/RasikaInteractionHeader"
      "responses":
        "200":
          "description": "Collection detail. Cache-Control: no-store."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CatalogueCollectionDetail"
        "400":
          "$ref": "#/components/responses/CatalogueValidationError"
        "404":
          "$ref": "#/components/responses/CatalogueNotFound"
  "/v2/catalogue/temples":
    "get":
      "tags":
        - "Catalogue"
      "summary": "Kshetras (temples) with published data"
      "description": "Published-only V2. Lists root temples only (child shrines are nested in detail), in mandalam order (declaration order, unassigned last), then name. A temple is listed only when it is eligible: a published kriti or a published kshetra overview is recorded at it or at one of its child shrines. Unknown or repeated query parameters and invalid enum values are rejected. Not paginated (about 100 temples)."
      "security": []
      "parameters":
        -
          "name": "element"
          "in": "query"
          "required": false
          "description": "Filters on the root temple's own bhuta. APPU is water."
          "schema":
            "$ref": "#/components/schemas/CatalogueTempleElement"
        -
          "name": "mandalam"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/CatalogueMandalam"
        -
          "$ref": "#/components/parameters/RasikaSessionHeader"
        -
          "$ref": "#/components/parameters/RasikaInteractionHeader"
      "responses":
        "200":
          "description": "Eligible root temples. Cache-Control: no-store."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CatalogueTempleList"
        "400":
          "$ref": "#/components/responses/CatalogueValidationError"
  "/v2/catalogue/temples/{id}":
    "get":
      "tags":
        - "Catalogue"
      "summary": "One kshetra with child shrines and the kritis sung there"
      "description": "Unknown and ineligible ids are 404. `krithis` are the published kritis recorded directly at this temple, by title; child shrines appear in `children`, each addressable by its own id. `recordedGap` is true when an overview exists but no published kriti is recorded here or in any eligible child; `overview` is then the recorded reason."
      "security": []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/RasikaSessionHeader"
        -
          "$ref": "#/components/parameters/RasikaInteractionHeader"
      "responses":
        "200":
          "description": "Temple detail. Cache-Control: no-store."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CatalogueTempleDetail"
        "400":
          "$ref": "#/components/responses/CatalogueValidationError"
        "404":
          "$ref": "#/components/responses/CatalogueNotFound"
